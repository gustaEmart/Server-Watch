services:
  serverwatch:
    build:
      context: .
      dockerfile: Dockerfile
    image: serverwatch-mvp:latest
    container_name: serverwatch
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
    ports:
      - "${SERVERWATCH_PORT:-3000}:3000"
    volumes:
      - serverwatch_data:/app/data
    cap_add:
      - NET_RAW
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  serverwatch_data:
