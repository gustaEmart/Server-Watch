services:
  serverwatch:
    build:
      context: .
      dockerfile: Dockerfile
    image: serverwatch-mvp:latest
    container_name: serverwatch
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      DATABASE_BACKUPS_DIR: /app/db-backups
      SERVERWATCH_STORAGE: ${SERVERWATCH_STORAGE:-mongodb}
      MONGODB_URI: ${MONGODB_URI:-mongodb://serverwatch:troque-essa-senha@mongodb:27017/serverwatch?authSource=admin}
      MONGODB_DB: ${MONGODB_DB:-serverwatch}
      SERVERWATCH_ADMIN_EMAIL: ${SERVERWATCH_ADMIN_EMAIL:-admin@serverwatch.local}
      SERVERWATCH_ADMIN_PASSWORD: ${SERVERWATCH_ADMIN_PASSWORD:-admin123}
      SERVERWATCH_PROBE_TOKEN: ${SERVERWATCH_PROBE_TOKEN:-}
      CLOUDBACKUP_API_KEY: ${CLOUDBACKUP_API_KEY:-}
      PROXMOX_PBS_BASE_URL: ${PROXMOX_PBS_BASE_URL:-}
      PROXMOX_PBS_TOKEN_ID: ${PROXMOX_PBS_TOKEN_ID:-}
      PROXMOX_PBS_TOKEN_SECRET: ${PROXMOX_PBS_TOKEN_SECRET:-}
      PROXMOX_PBS_TLS_FINGERPRINT: ${PROXMOX_PBS_TLS_FINGERPRINT:-}
      UNIFI_BASE_URL: ${UNIFI_BASE_URL:-}
      UNIFI_API_KEY: ${UNIFI_API_KEY:-}
      UNIFI_TLS_FINGERPRINT: ${UNIFI_TLS_FINGERPRINT:-}
      UNIFI_API_BASE_PATH: ${UNIFI_API_BASE_PATH:-/proxy/network/integration}
      SERVERWATCH_VAULT_TICKET_SECRET: ${SERVERWATCH_VAULT_TICKET_SECRET:-}
      NODE_OPTIONS: "--max-old-space-size=768"
    mem_limit: 1280m
    ports:
      - "${SERVERWATCH_PORT:-3000}:3000"
      - "${SERVERWATCH_HTTP_PORT:-80}:3000"
    volumes:
      - serverwatch_data:/app/data
      - serverwatch_db_backups:/app/db-backups
      - ./downloads:/app/downloads:ro
      - ./public:/app/public:ro
      - ./server.js:/app/server.js:ro
    depends_on:
      mongodb:
        condition: service_healthy
    cap_add:
      - NET_RAW
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongodb-backup:
    image: mongo:7
    container_name: serverwatch-mongodb-backup
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      DATABASE_BACKUPS_DIR: /backups
      MONGODB_URI: ${MONGODB_URI:-mongodb://serverwatch:troque-essa-senha@mongodb:27017/serverwatch?authSource=admin}
    command: ["sh", "/usr/local/bin/serverwatch-mongodb-backup-worker"]
    volumes:
      - serverwatch_db_backups:/backups
      - ./scripts/mongodb-backup-worker.sh:/usr/local/bin/serverwatch-mongodb-backup-worker:ro
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7
    container_name: serverwatch-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-serverwatch}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-troque-essa-senha}
    command: mongod --wiredTigerCacheSizeGB 0.25
    mem_limit: 768m
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  serverwatch_data:
  mongodb_data:
  serverwatch_db_backups:
